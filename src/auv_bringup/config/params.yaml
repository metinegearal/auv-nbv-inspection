waypoint_control_node:
  ros__parameters:
    # Active DLQR tuning: [vx, vy, vz, px, py, pz]. Stronger position tracking
    # keeps short NBV legs moving; velocity damping and motor limits are retained.
    state_weights: [80.0, 80.0, 80.0, 256.0, 256.0, 256.0]
    force_weights: [0.1, 0.1, 0.1]
    # Follow straight queue legs with velocity feedback; brake for turns/endpoints.
    waypoint_cruise_speed: 0.8
    waypoint_braking_acceleration: 0.8
    velocity_weights: [400.0, 400.0, 400.0]
    kp_yaw: 0.4
    kp_dist: 0.75
    dvl_active: true
    stopping_distance: 0.4
    # initial_waypoint_x: -14.0
    # initial_waypoint_y: -82.0
    # initial_waypoint_z: -29.5
    initial_waypoint_x: 354.0
    initial_waypoint_y: 828.0
    initial_waypoint_z: -298.0
    initial_waypoint_yaw: 0.0
    max_yaw_command: 5.0
    yaw_smoothing_rate: 0.8
    min_forward_thrust: 1.0
    max_forward_thrust: 8.0
    command_multiplier: 3.0

point_iterator:
  ros__parameters:
    camera_x: 0.35
    camera_y: 0.3875
    camera_z: -0.5
    # initial_waypoint_x: -14.0
    # initial_waypoint_y: -82.0
    # initial_waypoint_z: -29.5
    initial_waypoint_x: 354.0
    initial_waypoint_y: 828.0
    initial_waypoint_z: -298.0
    initial_waypoint_yaw: 0.0
    timer_period_s: 1.0
    waypoint_reached_distance: 0.5

planner_node:
  ros__parameters:
    voxel_resolution: 0.2
    max_depth: 5.0
    min_depth: 0.5
    z_min_target: -300.0
    depth_stride: 4
    depth_scale: 1.0
    planning_period: 100
    replan_on_target_arrival: true
    min_utility_threshold: 0.1
    # Maximum highest-utility candidates passed to route planning (positive integer).
    route_max_candidates: 5
    collision_radius: 0.4
    # Reserve 0.4 m waypoint handoff tolerance plus 0.2 m tracking uncertainty.
    collision_tracking_margin: 0.4
    # Cancel a route when an unfinished vehicle stops making positional progress.
    route_stall_timeout_s: 6.0
    route_stall_min_progress_m: 0.15
    trajectory_points: 300
    waypoint_spacing: 0.5
    trajectory_optimization_enabled: false
    velocity_history_window: 1.0
    trajectory_history_window: 5.0
    trajectory_continuity_weight: 8.0
    trajectory_reversal_weight: 4.0
    trajectory_history_weight: 2.0
    trajectory_history_radius: 0.5
    trajectory_max_deviation: 0.5
    trajectory_optimizer_max_iterations: 40
    octomap_path: results/final_map_ros2.bt
    visit_radius: 0.5
    results_dir: results
    use_incremental_map_cache: true
    # Log every NBV filter, candidate rejection, and planning result to ROS and JSONL.
    nbv_filter_logging: true
    
    # NBV geometry, sampling, and scoring live in nbv_params.yaml.
    
    astar_max_steps: 50000
    # Skip an actually failed target briefly, then allow another attempt.
    route_blacklist_cooldown_s: 30.0
    # Spatial radius for temporary bans, retry accounting, and exhausted retry regions (m).
    route_blacklist_radius_m: 0.5
    # Permanent exclusion radius after all sampled NBV rays are blocked (m).
    route_collision_blacklist_radius_m: 1.0
    spline_smoothing: 2.0
    collision_check_spacing_factor: 0.5
    arrival_target_radius: 1.5

run_baselines:
  ros__parameters:
    results_dir: results
    # Draw the reference rectangles and pipes in the trajectory overview.
    show_reference_objects: false

live_viewer:
  ros__parameters:
    # Match planner_node.octomap_path; maps refresh at planner snapshot saves.
    map_path: results/final_map_ros2.bt
    map_poll_period_s: 1.0
    render_hz: 20.0
    # Display-only downsampling and spatial chunks; unchanged chunks stay on the GPU.
    voxel_size_m: 0.2
    # Display-only statistical cleaning, as in test_env_2; false shows raw occupancy.
    filter_outliers: true
    outlier_neighbors: 15
    outlier_std_ratio: 1.5
    chunk_size_m: 4.0
    max_chunks_per_frame: 8
    point_size: 3.0
    window_width: 1280
    window_height: 800
    trajectory_topic: object/areaWaypoints
    odometry_topic: holocean/odom
    completion_topic: /movement/finished_execution
    show_target_frontiers: true
    # Empty follows map_path's directory; reads existing C++ planner diagnostics.
    frontier_log_path: ""
    frontier_poll_period_s: 0.5
    frontier_marker_radius_m: 0.35

depth_estimation:
  ros__parameters:
    sync_queue_size: 1
    sync_slop_s: 0.02
    results_dir: results
