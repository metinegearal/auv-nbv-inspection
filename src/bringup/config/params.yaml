waypoint_control_node:
  ros__parameters:
    kp_yaw: 0.5
    kp_dist: 0.75
    dvl_active: true
    stopping_distance: 0.4
    initial_waypoint_x: 354.0
    initial_waypoint_y: 828.0
    initial_waypoint_z: -298.0
    initial_waypoint_yaw: 0.0
    max_yaw_command: 10.0
    yaw_smoothing_rate: 0.8
    min_forward_thrust: 1.0
    max_forward_thrust: 8.0
    command_multiplier: 5.0

point_iterator:
  ros__parameters:
    world_frame: map
    nbv_server_timeout_s: 30.0
    nbv_feedback_timeout_s: 30.0
    nbv_goal_timeout_s: 120.0
    initial_waypoint_x: 354.0
    initial_waypoint_y: 828.0
    initial_waypoint_z: -298.0
    initial_waypoint_yaw: 0.0
    timer_period_s: 1.0
    waypoint_reached_distance: 0.5

planner_node:
  ros__parameters:
    world_frame: map
    body_frame: base_link
    camera_frame: camera_link
    voxel_resolution: 0.2
    max_depth: 5.0
    min_depth: 0.5
    z_min_target: -300.0
    depth_stride: 4
    depth_scale: 1.0
    planning_period: 100
    replan_on_target_arrival: true
    min_utility_threshold: 0.1
    collision_radius: 0.3
    # Extra clearance for the controller's 0.4 m waypoint completion tolerance.
    collision_tracking_margin: 0.4
    trajectory_points: 300
    waypoint_spacing: 0.5
    trajectory_optimization_enabled: false
    velocity_history_window: 1.0
    trajectory_history_window: 5.0
    trajectory_continuity_weight: 8.0
    trajectory_reversal_weight: 4.0
    trajectory_history_weight: 2.0
    trajectory_history_radius: 0.5
    trajectory_max_deviation: 0.5
    trajectory_optimizer_max_iterations: 40
    octomap_path: results/final_map_ros2.bt
    visit_radius: 0.5
    results_dir: results
    use_incremental_map_cache: true
    # Log every NBV filter, candidate rejection, and planning result to ROS and JSONL.
    nbv_filter_logging: true
    
    # NBV geometry, sampling, and scoring live in nbv_params.yaml.
    
    astar_max_steps: 50000
    # Skip an actually failed target briefly, then allow another attempt.
    route_blacklist_cooldown_s: 30.0
    spline_smoothing: 2.0
    collision_check_spacing_factor: 0.5
    arrival_target_radius: 2.5

# Camera optical axes: X right, Y down, Z forward. This quaternion combines
# the downward 45 degree mount tilt with the optical-axis convention.
camera_static_transform:
  ros__parameters:
    frame_id: base_link
    child_frame_id: camera_link
    translation.x: 0.35
    translation.y: 0.3875
    translation.z: -0.5
    rotation.x: -0.6532814824381883
    rotation.y: 0.6532814824381883
    rotation.z: -0.2705980500730985
    rotation.w: 0.2705980500730985

run_baselines:
  ros__parameters:
    results_dir: results
    # Draw the reference rectangles and pipes in the trajectory overview.
    show_reference_objects: false

depth_estimation:
  ros__parameters:
    sync_queue_size: 1
    sync_slop_s: 0.02
    results_dir: results
