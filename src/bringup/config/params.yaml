waypoint_control_node:
  ros__parameters:
    kp_yaw: 0.6
    kp_dist: 0.75
    dvl_active: true
    stopping_distance: 0.25
    initial_waypoint_x: 10.0
    initial_waypoint_y: 10.0
    initial_waypoint_z: 5.0
    max_yaw_command: 10.0
    min_forward_thrust: 1.0
    max_forward_thrust: 10.0
    command_multiplier: 2.0

point_extract:
  ros__parameters:
    look_ahead_pixels: 100
    angle_weight: 0.5

point_iterator:
  ros__parameters:
    camera_x: 0.35
    camera_y: 0.3875
    camera_z: -0.5
    initial_waypoint_x: -16.0
    initial_waypoint_y: -81.0
    initial_waypoint_z: -30.0
    initial_waypoint_yaw: 0.0
    timer_period_s: 1.0
    waypoint_reached_distance: 0.4

planner_node:
  ros__parameters:
    voxel_resolution: 0.1
    max_depth: 3.0
    min_depth: 0.5
    z_min_target: -32.0
    depth_stride: 4
    depth_scale: 1.0
    planning_period: 10
    min_utility_threshold: 0.01
    collision_radius: 0.3
    trajectory_points: 300
    waypoint_spacing: 0.5
    octomap_path: results/final_map_ros2.bt
    visit_radius: 0.25
    results_dir: results

run_baselines:
  ros__parameters:
    results_dir: results

depth_estimation:
  ros__parameters:
    sync_queue_size: 1
    sync_slop_s: 0.02
    results_dir: results