waypoint_control_node:
  ros__parameters:
    kp_yaw: 0.6
    kp_dist: 0.75
    max_yaw_thrust: 3.0
    absolute_max_motor_signal: 40.0
    yaw_deadband_deg: 15.0
    dvl_active: true

point_extract:
  ros__parameters:
    look_ahead_pixels: 100
    angle_weight: 0.5

nbv_utility_node:
  ros__parameters:
    # Sensor & Resolution
    voxel_resolution: 0.1
    max_depth: 4.0               # INCREASED from 4.0. Points beyond this are ignored.
    min_depth: 0.5               # Points closer than this are ignored.
    
    # Exploration Filters (Lowering these means MORE points are accepted as targets)
    z_min_target: -32.0          # INCREASED depth limit from -32.0
    info_gain_threshold: 0.12    # DECREASED from 0.15 (Accepts less informative points)
    sparsity_multiplier: 1.1     # DECREASED from 1.2 (Allows denser clusters to be frontiers)
    min_utility_threshold: 0.01 # DECREASED from 0.02 (Accepts less efficient viewpoints)